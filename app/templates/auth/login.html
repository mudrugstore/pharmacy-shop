{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ · {{ store_name }}{% endblock %}
{% block content %}
<div class="form-box">
    <div class="form-logo">{{ store_name }}</div>
    <h1 class="page-title" style="text-align:center; font-size:1.2rem;">เข้าสู่ระบบ</h1>
    <form method="post">
        <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" name="phone" value="{{ phone or '' }}" required>
        </div>
        <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" name="password" required>
            <span class="muted" style="font-size:.8rem;">ถ้าทางร้านเพิ่งรีเซ็ตรหัสให้ ใส่อะไรก็ได้ในช่องนี้ ระบบจะพาไปตั้งรหัสใหม่</span>
        </div>
        <button type="submit" class="btn btn-block">เข้าสู่ระบบ</button>
    </form>
    <p class="muted" style="margin-top:14px; text-align:center;">
        <a href="{{ url_for('auth.forgot') }}">ลืมรหัสผ่าน?</a>
    </p>
    <p class="muted" style="text-align:center;">
        ยังไม่มีบัญชี? <a href="{{ url_for('auth.register') }}">สมัครสมาชิก</a>
    </p>
</div>
{% endblock %}
